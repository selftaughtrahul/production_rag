name: eval

on:
  push:
  pull_request:

jobs:
  golden-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline golden metrics and Ragas (skipped without API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAGAS_DO_NOT_TRACK: "true"
        run: python evals/run_eval.py --offline --with-ragas

  unit-tests:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test-jwt-secret-key-32-chars-minimum-xx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unit-test dependencies
        run: >
          pip install pytest==8.3.5 sqlalchemy langchain-core pydantic
          python-jose passlib argon2-cffi python-dotenv langsmith
      - name: Routing, SQL allowlist, and auth
        run: python -m pytest tests/test_routing.py tests/test_sql_allowlist.py tests/test_auth.py -q
      - name: Hybrid retrieve (needs chromadb import path)
        run: python -m pytest tests/test_hybrid_retrieve.py -q
        continue-on-error: true
