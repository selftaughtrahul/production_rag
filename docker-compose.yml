services:

  redis:
    image: redis:7-alpine
    container_name: basic_rag_redis
    restart: unless-stopped
    networks:
      - basic_rag
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    container_name: basic_rag_chroma
    restart: unless-stopped
    networks:
      - basic_rag
    volumes:
      - chroma_data:/chroma/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data

  postgres:
    image: postgres:16-alpine
    container_name: basic_rag_postgres
    restart: unless-stopped
    networks:
      - basic_rag
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: basic_rag_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - basic_rag
    expose:
      - "8000"
    volumes:
      - .:/app
      - ./documents:/app/documents
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: basic_rag_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info -P solo
    restart: unless-stopped
    networks:
      - basic_rag
    volumes:
      - .:/app
      - ./documents:/app/documents
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy

  ui:
    build: .
    container_name: basic_rag_ui
    command: streamlit run frontend/app.py --server.port 8002 --server.address 0.0.0.0 --server.headless true
    restart: unless-stopped
    networks:
      - basic_rag
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: basic_rag_prometheus
    restart: unless-stopped
    networks:
      - basic_rag
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    container_name: basic_rag_grafana
    restart: unless-stopped
    networks:
      - basic_rag
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

networks:
  basic_rag:
    driver: bridge

volumes:
  redis_data:
  chroma_data:
  postgres_data:
  prometheus_data:
  grafana_data:
