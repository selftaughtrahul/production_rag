# basic_rag on EC2 — nginx listens on 8002, uvicorn stays on 127.0.0.1:8000.
#
# On Ubuntu/Amazon Linux:
#   sudo apt-get update && sudo apt-get install -y nginx
#   sudo cp deploy/nginx-8002.conf /etc/nginx/sites-available/basic-rag
#   sudo ln -sf /etc/nginx/sites-available/basic-rag /etc/nginx/sites-enabled/basic-rag
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# API (bind loopback only; do not open 8000 in the security group):
#   uvicorn main:app --host 127.0.0.1 --port 8000
#
# Security group inbound: TCP 22 (SSH), TCP 8002 (this proxy). Not 8000.
# Public URL: http://<ec2-public-ip>:8002

upstream basic_rag_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 8002;
    listen [::]:8002;
    server_name _;

    client_max_body_size 50m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://basic_rag_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # SSE on POST /chat/ — do not buffer tokens
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
    }
}
