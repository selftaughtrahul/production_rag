<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · RAG Console</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-page="dashboard" class="is-loading">
  <div class="gpt-shell">
    <aside class="gpt-sidebar" id="sidebar">
      <nav class="gpt-nav" aria-label="Sections">
        <a href="/app">Chat</a>
        <a href="/dashboard" class="is-active">Dashboard</a>
        <a href="/files">Documents</a>
      </nav>
      <div class="gpt-sidebar-foot">
        <button type="button" class="user profile-btn" id="username"></button>
        <button type="button" class="btn ghost" id="logout">Log out</button>
      </div>
    </aside>

    <section class="gpt-main">
      <header class="gpt-top">
        <button type="button" class="gpt-menu" id="toggle-sidebar" aria-label="Toggle sidebar">☰</button>
        <span class="gpt-title">Dashboard</span>
      </header>
      <div class="gpt-page">
        <h1>Dashboard</h1>
        <p class="sub">GPU load and the document ingest queue, refreshed every few seconds.</p>
        <div class="alert" id="monitor-error" role="alert"></div>
        <div class="monitor-grid">
          <section class="monitor-card" aria-labelledby="gpu-heading">
            <h2 id="gpu-heading">GPU</h2>
            <p class="monitor-state" id="gpu-state">Checking…</p>
            <dl class="monitor-stats" id="gpu-stats"></dl>
          </section>
          <section class="monitor-card" aria-labelledby="queue-heading">
            <h2 id="queue-heading">Queue</h2>
            <p class="monitor-state" id="queue-state">Checking…</p>
            <dl class="monitor-stats" id="queue-stats"></dl>
            <ul class="monitor-list" id="queue-list"></ul>
          </section>
        </div>
        <p class="monitor-updated" id="monitor-updated"></p>
      </div>
    </section>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/memory.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
