<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents · RAG Console</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-page="documents" class="is-loading">
  <div class="gpt-shell">
    <aside class="gpt-sidebar" id="sidebar">
      <nav class="gpt-nav" aria-label="Sections">
        <a href="/app">Chat</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/files" class="is-active">Documents</a>
      </nav>
      <div class="gpt-sidebar-foot">
        <button type="button" class="user profile-btn" id="username"></button>
        <button type="button" class="btn ghost" id="logout">Log out</button>
      </div>
    </aside>

    <section class="gpt-main">
      <header class="gpt-top">
        <button type="button" class="gpt-menu" id="toggle-sidebar" aria-label="Toggle sidebar">☰</button>
        <span class="gpt-title">Documents</span>
      </header>
      <div class="gpt-page">
        <h1>Documents</h1>
        <p class="sub">Upload files, tag them, and manage what the assistant can search.</p>
        <div class="alert" id="docs-alert" role="alert"></div>
        <div class="alert is-info" id="docs-info" role="status"></div>

        <form class="doc-upload" id="upload-form">
          <label class="doc-file">
            <span class="doc-file-label">File</span>
            <input type="file" id="upload-file" required>
          </label>
          <label class="doc-tags-field">
            <span class="doc-file-label">Tags</span>
            <div id="upload-tags" data-placeholder="Type a tag, press Enter"></div>
          </label>
          <button type="submit" class="btn" id="upload-btn">Upload</button>
        </form>

        <div class="doc-toolbar">
          <span class="doc-count" id="doc-count"></span>
          <div class="view-toggle" role="group" aria-label="View">
            <button type="button" class="view-btn" data-view="list" aria-pressed="false">List</button>
            <button type="button" class="view-btn" data-view="grid" aria-pressed="false">Grid</button>
          </div>
        </div>
        <ul class="doc-list is-list" id="doc-list"></ul>
      </div>
    </section>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/memory.js"></script>
  <script src="/static/js/chips.js"></script>
  <script src="/static/js/documents.js"></script>
</body>
</html>
